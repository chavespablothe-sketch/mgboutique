name: Build + Deploy Hostinger

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
            fonts-liberation libgtk-3-0 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Preserve build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/

      - name: Install secure transfer client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Detect reachable secure protocol
        id: endpoint
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set -eu
          norm() {
            h="$1"
            h="${h#ftp://}"; h="${h#ftps://}"; h="${h#sftp://}"
            h="${h%%/*}"; h="${h%%:*}"
            printf '%s' "$h"
          }

          primary="$(norm "$RAW_SERVER")"
          candidates="$primary ftp.minhagloria.com.br minhagloria.com.br www.minhagloria.com.br"
          chosen_host=""
          chosen_protocol=""

          for host in $candidates; do
            [ -n "$host" ] || continue
            getent hosts "$host" >/dev/null 2>&1 || continue
            echo "Testing secure transfer endpoints for $host"
            if timeout 5 bash -c "</dev/tcp/$host/22" 2>/dev/null; then
              chosen_host="$host"; chosen_protocol="sftp"; break
            fi
            if timeout 5 bash -c "</dev/tcp/$host/21" 2>/dev/null; then
              chosen_host="$host"; chosen_protocol="ftps-explicit"; break
            fi
            if timeout 5 bash -c "</dev/tcp/$host/990" 2>/dev/null; then
              chosen_host="$host"; chosen_protocol="ftps-implicit"; break
            fi
          done

          if [ -z "$chosen_host" ]; then
            echo "::error::Hostinger did not answer on SFTP 22, FTPS 21, or FTPS 990. The build artifact remains available for 7 days."
            exit 1
          fi

          echo "Selected $chosen_protocol on $chosen_host"
          echo "host=$chosen_host" >> "$GITHUB_OUTPUT"
          echo "protocol=$chosen_protocol" >> "$GITHUB_OUTPUT"

      - name: Deploy over available secure protocol
        env:
          DEPLOY_HOST: ${{ steps.endpoint.outputs.host }}
          DEPLOY_PROTOCOL: ${{ steps.endpoint.outputs.protocol }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          deploy() {
            case "$DEPLOY_PROTOCOL" in
              sftp)
                lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" "sftp://$DEPLOY_HOST:22" -e \
                  "set sftp:auto-confirm yes; mirror --reverse --delete --verbose --parallel=3 ./dist/ /public_html/; bye"
                ;;
              ftps-explicit)
                lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" "ftp://$DEPLOY_HOST:21" -e \
                  "set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ftp:passive-mode yes; set ssl:verify-certificate yes; mirror --reverse --delete --verbose --parallel=3 ./dist/ /public_html/; bye"
                ;;
              ftps-implicit)
                lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" "ftps://$DEPLOY_HOST:990" -e \
                  "set ftp:passive-mode yes; set ssl:verify-certificate yes; mirror --reverse --delete --verbose --parallel=3 ./dist/ /public_html/; bye"
                ;;
            esac
          }

          for attempt in 1 2; do
            echo "Secure deploy attempt $attempt/2"
            if deploy; then exit 0; fi
            [ "$attempt" -eq 2 ] || sleep 10
          done
          echo "::error::Secure transfer failed after two attempts. The build artifact remains available for 7 days."
          exit 1
