name: Build + Deploy Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies for Chromium (react-snap)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
            fonts-liberation libgtk-3-0 || \
          sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm install

      - name: Build project (with static prerender)
        run: npm run build

      # Normaliza o host do FTP_SERVER (remove ftp://, ftps://, sftp:// e
      # qualquer barra/porta) para que possamos tentar protocolos/portas
      # diferentes sem depender de como o secret foi cadastrado.
      - name: Normalize FTP host + diagnose connectivity
        id: host
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set +e
          host="$RAW_SERVER"
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host#sftp://}"
          host="${host%%/*}"
          host="${host%%:*}"

          if [ -z "$host" ]; then
            echo "::error::Secret FTP_SERVER está VAZIO. Cadastre o host FTP da Hostinger (ex: ftp.minhagloria.com.br ou o host que aparece em hPanel → Arquivos → Contas FTP)."
            exit 1
          fi

          echo "=========================================="
          echo "Host normalizado a partir do secret: $host"
          echo "=========================================="

          echo "→ Tentando resolver DNS de $host ..."
          getent hosts "$host" || echo "⚠️  DNS não resolveu para $host"

          echo "→ Testando TCP 21 (FTPS explícito) ..."
          timeout 10 bash -c "</dev/tcp/$host/21" && echo "✅ Porta 21 acessível" || echo "❌ Porta 21 inacessível"

          echo "→ Testando TCP 990 (FTPS implícito) ..."
          timeout 10 bash -c "</dev/tcp/$host/990" && echo "✅ Porta 990 acessível" || echo "❌ Porta 990 inacessível"

          echo "→ Testando TCP 22 (SFTP/SSH) ..."
          timeout 10 bash -c "</dev/tcp/$host/22" && echo "✅ Porta 22 acessível" || echo "❌ Porta 22 inacessível"

          echo "host=$host" >> "$GITHUB_OUTPUT"

          # Se nenhuma porta FTP responde, aborta cedo com mensagem clara
          if ! timeout 10 bash -c "</dev/tcp/$host/21" 2>/dev/null && \
             ! timeout 10 bash -c "</dev/tcp/$host/990" 2>/dev/null; then
            echo "::error::Nenhuma porta FTP (21/990) respondeu em '$host'. Verifique no hPanel da Hostinger → Arquivos → Contas FTP qual é o HOSTNAME correto (geralmente 'ftp.SEUDOMINIO.com.br' ou um IP específico). Atualize o secret FTP_SERVER no GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      # Estratégia de fallback (sem precisar mexer em nada no GitHub):
      #   1) FTPS explícito porta 21  (preferido pela Hostinger)
      #   2) FTPS implícito porta 990 (alguns hosts bloqueiam a 21)
      #   3) FTP simples porta 21     (último recurso)
      # Cada tentativa só roda se a anterior falhar.

      - name: Deploy FTPS explícito :21 (tentativa 1)
        id: t1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 300000
          log-level: minimal

      - name: Aguardar antes da tentativa 2
        if: steps.t1.outcome == 'failure'
        run: sleep 20

      - name: Deploy FTPS implícito :990 (tentativa 2)
        id: t2
        if: steps.t1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 990
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 300000
          log-level: minimal

      - name: Aguardar antes da tentativa 3
        if: steps.t1.outcome == 'failure' && steps.t2.outcome == 'failure'
        run: sleep 30

      - name: Deploy FTPS explícito :21 (tentativa 3 — retry)
        id: t3
        if: steps.t1.outcome == 'failure' && steps.t2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 300000
          log-level: minimal

      - name: Aguardar antes do fallback final
        if: steps.t1.outcome == 'failure' && steps.t2.outcome == 'failure' && steps.t3.outcome == 'failure'
        run: sleep 60

      - name: Deploy FTP simples :21 (fallback final)
        if: steps.t1.outcome == 'failure' && steps.t2.outcome == 'failure' && steps.t3.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 300000
          log-level: minimal
