name: Build + Deploy Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies for Chromium (react-snap)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
            fonts-liberation libgtk-3-0 || \
          sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm install

      - name: Build project (with static prerender)
        run: npm run build

      # Normaliza o host do FTP_SERVER (remove ftp://, ftps://, sftp:// e
      # qualquer barra/porta) para que possamos tentar protocolos/portas
      # diferentes sem depender de como o secret foi cadastrado.
      # Descobre um host FTP acessível sem depender de ajustes manuais no GitHub.
      # Testa o secret FTP_SERVER e também candidatos padrão da Hostinger.
      - name: Descobrir host FTP acessível
        id: host
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set +e
          norm() {
            h="$1"
            h="${h#ftp://}"; h="${h#ftps://}"; h="${h#sftp://}"
            h="${h%%/*}"; h="${h%%:*}"
            echo "$h"
          }

          primary="$(norm "$RAW_SERVER")"
          domain="minhagloria.com.br"

          candidates="$primary ftp.$domain $domain www.$domain"

          chosen=""
          chosen_port=""
          for h in $candidates; do
            [ -z "$h" ] && continue
            echo "=== Testando host: $h ==="
            getent hosts "$h" >/dev/null 2>&1 || { echo "  ⚠️  DNS não resolveu"; continue; }
            for port in 21 990; do
              if timeout 10 bash -c "</dev/tcp/$h/$port" 2>/dev/null; then
                echo "  ✅ porta $port acessível"
                if [ -z "$chosen" ]; then chosen="$h"; chosen_port="$port"; fi
              else
                echo "  ❌ porta $port inacessível"
              fi
            done
          done

          if [ -z "$chosen" ]; then
            echo "⚠️  Nenhum candidato respondeu no pré-teste. Seguindo mesmo assim com '${primary:-ftp.$domain}' — o pré-teste TCP pode falhar por firewall do runner enquanto o deploy funciona."
            chosen="${primary:-ftp.$domain}"
            chosen_port="21"
          fi

          echo "Host escolhido: $chosen (porta preferida $chosen_port)"
          echo "host=$chosen" >> "$GITHUB_OUTPUT"

      # Estratégia de fallback (sem precisar mexer em nada no GitHub):
      #   1) FTPS explícito porta 21  (preferido pela Hostinger)
      #   2) FTPS implícito porta 990 (alguns hosts bloqueiam a 21)
      #   3) FTP simples porta 21     (último recurso)
      # Cada tentativa só roda se a anterior falhar.

      - name: Deploy FTPS explícito :21 (tentativa 1)
        id: t1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 300000
          log-level: minimal

      - name: Aguardar antes da tentativa 2
        if: steps.t1.outcome == 'failure'
        run: sleep 20

      - name: Deploy FTPS implícito :990 (tentativa 2)
        id: t2
        if: steps.t1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 990
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 300000
          log-level: minimal

      - name: Aguardar antes da tentativa 3
        if: steps.t1.outcome == 'failure' && steps.t2.outcome == 'failure'
        run: sleep 30

      - name: Deploy FTPS explícito :21 (tentativa 3 — retry)
        id: t3
        if: steps.t1.outcome == 'failure' && steps.t2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 300000
          log-level: minimal

      - name: Aguardar antes do fallback final
        if: steps.t1.outcome == 'failure' && steps.t2.outcome == 'failure' && steps.t3.outcome == 'failure'
        run: sleep 60

      - name: Deploy FTP simples :21 (fallback final)
        if: steps.t1.outcome == 'failure' && steps.t2.outcome == 'failure' && steps.t3.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          timeout: 300000
          log-level: minimal
