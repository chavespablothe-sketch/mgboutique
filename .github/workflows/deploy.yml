name: Build + Deploy Hostinger

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
            fonts-liberation libgtk-3-0 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Preserve build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/

      - name: Install secure transfer client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Discover reachable endpoints
        id: endpoint
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          set -eu
          norm() {
            h="$1"
            h="${h#ftp://}"; h="${h#ftps://}"; h="${h#sftp://}"
            h="${h%%/*}"; h="${h%%:*}"
            printf '%s' "$h"
          }

          primary="$(norm "$RAW_SERVER")"
          candidates="$primary ftp.minhagloria.com.br minhagloria.com.br www.minhagloria.com.br"
          seen=""
          endpoints=""

          for host in $candidates; do
            [ -n "$host" ] || continue
            case " $seen " in *" $host "*) continue;; esac
            seen="$seen $host"
            getent hosts "$host" >/dev/null 2>&1 || { echo "DNS failed for $host"; continue; }
            for port in 22 21 990; do
              if timeout 8 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then
                echo "Reachable: $host:$port"
                endpoints="$endpoints $host:$port"
              else
                echo "Closed: $host:$port"
              fi
            done
          done

          if [ -z "$endpoints" ]; then
            echo "::error::Nenhuma porta segura (22/21/990) respondeu na Hostinger. O artefato do build fica disponivel por 7 dias."
            exit 1
          fi

          echo "endpoints=$(echo $endpoints)" >> "$GITHUB_OUTPUT"

      - name: Deploy over first working endpoint
        env:
          ENDPOINTS: ${{ steps.endpoint.outputs.endpoints }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          MIRROR="mirror --reverse --delete --verbose --parallel=2 ./dist/ /public_html/"
          COMMON="set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; set ssl:verify-certificate no; set ftp:passive-mode yes; set sftp:auto-confirm yes;"

          try_endpoint() {
            host="${1%%:*}"; port="${1##*:}"
            case "$port" in
              22)  url="sftp://$host:22";  extra="" ;;
              21)  url="ftp://$host:21";   extra="set ftp:ssl-force yes; set ftp:ssl-protect-data yes;" ;;
              990) url="ftps://$host:990"; extra="set ftp:ssl-protect-data yes;" ;;
              *) return 1 ;;
            esac
            echo "=== Tentando $url ==="
            lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" "$url" -e "$COMMON $extra $MIRROR; bye"
          }

          for attempt in 1 2; do
            for ep in $ENDPOINTS; do
              if try_endpoint "$ep"; then
                echo "Deploy concluido via $ep"
                exit 0
              fi
              echo "Falhou em $ep"
            done
            [ "$attempt" -eq 2 ] || sleep 15
          done

          echo "::error::Todas as tentativas de transferencia falharam (verifique usuario/senha FTP e se o IP do GitHub esta liberado na Hostinger). O artefato do build fica disponivel por 7 dias."
          exit 1
