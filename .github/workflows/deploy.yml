name: Build + Deploy Hostinger

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
            fonts-liberation libgtk-3-0 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Preserve build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/

      - name: Install secure transfer client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hostinger
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail

          if [ -z "${RAW_SERVER:-}" ] || [ -z "${DEPLOY_USER:-}" ] || [ -z "${DEPLOY_PASSWORD:-}" ]; then
            echo "::error::Os secrets FTP_SERVER, FTP_USERNAME e FTP_PASSWORD precisam estar preenchidos."
            exit 1
          fi

          norm() {
            h="$1"
            h="${h#ftp://}"; h="${h#ftps://}"; h="${h#sftp://}"
            h="${h%%/*}"; h="${h%%:*}"
            printf '%s' "$h"
          }

          primary="$(norm "$RAW_SERVER")"
          candidates="$primary ftp.minhagloria.com.br minhagloria.com.br www.minhagloria.com.br"
          MIRROR="mirror --reverse --delete --verbose --parallel=2 ./dist/ /public_html/"
          COMMON="set cmd:fail-exit yes; set net:timeout 25; set net:max-retries 1; set net:reconnect-interval-base 3; set ssl:verify-certificate no; set ftp:passive-mode yes; set sftp:auto-confirm yes;"

          try_transfer() {
            host="$1"; mode="$2"
            case "$mode" in
              sftp)         url="sftp://$host:22"; extra="" ;;
              ftps-explicit) url="ftp://$host:21"; extra="set ftp:ssl-force yes; set ftp:ssl-protect-data yes;" ;;
              ftps-implicit) url="ftps://$host:990"; extra="set ftp:ssl-protect-data yes;" ;;
              ftp)           url="ftp://$host:21"; extra="set ftp:ssl-force no; set ftp:ssl-allow no;" ;;
              *) return 1 ;;
            esac
            echo "=== Tentando $url ==="
            lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" "$url" -e "$COMMON $extra $MIRROR; bye"
          }

          seen=""
          for attempt in 1 2; do
            for host in $candidates; do
              [ -n "$host" ] || continue
              case " $seen " in *" $host "*) [ "$attempt" -eq 1 ] && continue;; esac
              [ "$attempt" -eq 2 ] || seen="$seen $host"
              for mode in sftp ftps-explicit ftps-implicit ftp; do
                if try_transfer "$host" "$mode"; then
                  echo "Deploy concluido em $host via $mode"
                  exit 0
                fi
                echo "Falhou: $host via $mode"
              done
            done
            if [ "$attempt" -eq 1 ]; then
              echo "Aguardando antes da tentativa final..."
              sleep 15
            fi
          done

          echo "::error::A Hostinger recusou ou não respondeu a SFTP/FTPS/FTP em todos os endereços. O build foi preservado como artefato por 7 dias."
          exit 1
