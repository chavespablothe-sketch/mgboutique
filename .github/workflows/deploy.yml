name: Build + Deploy Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies for Chromium (react-snap)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
            fonts-liberation libgtk-3-0 || \
          sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm install

      - name: Build project (with static prerender)
        run: npm run build

      # Deploy incremental (sem dangerous-clean-slate) com retry automático
      # para tolerar a instabilidade do FTP da Hostinger.
      - name: Deploy via FTP
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            npx --yes @samkirkland/ftp-deploy@4.3.5 \
              --server "$FTP_SERVER" \
              --username "$FTP_USERNAME" \
              --password "$FTP_PASSWORD" \
              --protocol ftp \
              --port 21 \
              --local-dir ./dist/ \
              --server-dir /public_html/ \
              --timeout 300000 \
              --log-level minimal
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
