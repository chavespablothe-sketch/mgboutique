name: Build + Deploy Hostinger

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
            fonts-liberation libgtk-3-0 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Preserve build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: dist/

      - name: Install secure transfer client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Hostinger
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          DEPLOY_USER: ${{ secrets.FTP_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail

          if [ -z "${RAW_SERVER:-}" ] || [ -z "${DEPLOY_USER:-}" ] || [ -z "${DEPLOY_PASSWORD:-}" ]; then
            echo "::error::Os secrets FTP_SERVER, FTP_USERNAME e FTP_PASSWORD precisam estar preenchidos."
            exit 1
          fi

          norm() {
            h="$1"
            h="${h#ftp://}"; h="${h#ftps://}"; h="${h#sftp://}"
            h="${h%%/*}"; h="${h%%:*}"
            printf '%s' "$h"
          }

          primary="$(norm "$RAW_SERVER")"
          # O domínio principal responde em FTP explícito/TLS. O antigo
          # ftp.minhagloria.com.br não possui DNS e as portas 22/990 expiram,
          # consumindo todo o tempo do job antes do deploy real começar.
          candidates="minhagloria.com.br $primary www.minhagloria.com.br"
          MIRROR="mirror --reverse --delete --verbose --parallel=2 ./dist/ /public_html/"
          COMMON="set cmd:fail-exit yes; set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; set ssl:verify-certificate no; set ftp:passive-mode yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes;"

          try_transfer() {
            host="$1"
            echo "=== Enviando por FTPS explícito para $host:21 ==="
            lftp -u "$DEPLOY_USER,$DEPLOY_PASSWORD" "ftp://$host:21" \
              -e "$COMMON $MIRROR; bye"
          }

          seen=""
          for attempt in 1 2 3; do
            for host in $candidates; do
              [ -n "$host" ] || continue
              case " $seen " in *" $host "*) [ "$attempt" -eq 1 ] && continue;; esac
              [ "$attempt" -ne 1 ] || seen="$seen $host"
              if try_transfer "$host"; then
                echo "Deploy concluido em $host via FTPS explícito"
                exit 0
              fi
              echo "Falhou: $host via FTPS explícito (tentativa $attempt/3)"
            done
            if [ "$attempt" -lt 3 ]; then
              echo "Aguardando 10 segundos antes da próxima tentativa..."
              sleep 10
            fi
          done

          echo "::error::A Hostinger recusou o FTPS explícito na porta 21. Confira no log se houve timeout ou erro 530 de credenciais. O build foi preservado como artefato por 7 dias."
          exit 1
